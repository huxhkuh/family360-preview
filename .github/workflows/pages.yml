name: Test and publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser and dependencies
        run: |
          # The Azure package mirror throttled font downloads for over ten minutes.
          # Use the official Ubuntu archive for the same signed packages.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Check built demo on desktop and mobile
        env:
          DEMO_URL: http://127.0.0.1:5248/family360-preview/
        run: |
          npm run preview -- --port 5248 > /tmp/family360-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent "$DEMO_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$DEMO_URL" > /dev/null
          npm run test:demo
          node scripts/check-journey.mjs
          npm run test:guided-call
          npm run test:yitzchak-feedback
          npm run test:ux
          npm run test:professional-admin
          npm run test:client-intake
          npm run test:chapter-process
          npm run test:client-workspace
          npm run test:client-folio
          npm run test:branding
          npm run test:companion
          npm run test:date-picker
          npm run test:client-copy
          npm run test:client-focus
          npm run test:client-decisions
          npm run test:new-client-optional
          node scripts/check-homepage.mjs
          npm run test:growth
          npm run test:final-report
          npm run test:representative
          npm run test:completed-example
          npm run test:customer-journey
          npm run test:task-surfaces
          npm run test:focused-home
          npm run test:workspace-brand
          npm run test:hero-gaze
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
