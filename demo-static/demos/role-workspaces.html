        break;
      case "analysis-return":
        modal("\u05D4\u05D7\u05D6\u05E8\u05EA \u05D4\u05E0\u05D9\u05EA\u05D5\u05D7 \u05DC\u05D4\u05E9\u05DC\u05DE\u05D4", `<form data-form="return"><label>\u05DE\u05D4 \u05E6\u05E8\u05D9\u05DA \u05DC\u05D4\u05E9\u05DC\u05D9\u05DD?<textarea name="reason" required></textarea></label>${B("\u05D4\u05D7\u05D6\u05E8\u05D4 \u05DC\u05D1\u05E2\u05DC \u05D4\u05DE\u05E7\u05E6\u05D5\u05E2", 'type="submit"', "primary")}</form>`);
        break;
      case "start-execution":
        s.execution.status = "working";
        s.execution.history.unshift("\u05D4\u05D8\u05D9\u05E4\u05D5\u05DC \u05D4\u05EA\u05D7\u05D9\u05DC");
        log("\u05D4\u05EA\u05D7\u05D9\u05DC \u05D1\u05D9\u05E6\u05D5\u05E2 \u05D1\u05DE\u05E9\u05E4\u05D7\u05EA \u05E8\u05D6");
        rerender();
        break;
      case "execution-approve":
        s.execution.status = "completed";
        s.execution.history.unshift("\u05D4\u05E0\u05E6\u05D9\u05D2 \u05D0\u05D9\u05E9\u05E8 \u05D0\u05EA \u05D4\u05E9\u05DC\u05DE\u05EA \u05D4\u05D1\u05D9\u05E6\u05D5\u05E2");
        log("\u05D1\u05D9\u05E6\u05D5\u05E2 \u05D1\u05DE\u05E9\u05E4\u05D7\u05EA \u05E8\u05D6 \u05D0\u05D5\u05E9\u05E8 \u05D5\u05D4\u05D5\u05E9\u05DC\u05DD");
        rerender();
        break;
      case "reset":
        s = seed();
        persist();
        $("#dialog").close();
        render();
        toast("\u05D4\u05D4\u05D3\u05D2\u05DE\u05D4 \u05D0\u05D5\u05E4\u05E1\u05D4");
        break;
    }
  });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.analysis) {
      s.analysis[t.dataset.analysis] = t.value;
      persist();
    }
    if (t.dataset.execution) {
      s.execution[t.dataset.execution] = t.value;
      persist();
    }
    if (t.dataset.draft === "call") {
      s.call = t.value;
      s.callDone = false;
      persist();
    }
    if (t.id === "family-search") {
      s.ui.familyQuery = t.value;
      persist();
      applyFamilyFilter();
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "family-switch") nav("rep/case/" + t.value + "/overview");
    if (t.id === "family-filter") {
      s.ui.familyFilter = t.value;
      persist();
      applyFamilyFilter();
    }
    if (t.dataset.reportFilter) {
      s.reportFilter[t.dataset.reportFilter] = t.value;
      persist();
      rerender();
      document.querySelector(`[data-report-filter="${t.dataset.reportFilter}"]`)?.focus({ preventScroll: true });
    }
    if (e.target.dataset.analysis) {
      s.analysis[e.target.dataset.analysis] = e.target.value;
      persist();
    }
  });
  document.addEventListener("submit", (e) => {
    const form = e.target;
    if (!form.dataset.form) return;
    e.preventDefault();
    const d = new FormData(form);
    let message = "\u05D4\u05E9\u05D9\u05E0\u05D5\u05D9 \u05E0\u05E9\u05DE\u05E8 \u05D1\u05D4\u05D3\u05D2\u05DE\u05D4";
    switch (form.dataset.form) {
      case "hours": {
        const minutes = Number(d.get("minutes"));
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 720) return;
        s.finance.hours.push({ id: "H-" + crypto.randomUUID().slice(0, 8), family: String(d.get("family")), rep: String(d.get("rep")), date: String(d.get("date")), task: String(d.get("task")), minutes, rate: d.get("rep") === "\u05D9\u05E9\u05E8\u05D0\u05DC \u05DB\u05D4\u05DF" ? 1e4 : 8e3, approved: false });
        log("\u05E0\u05D5\u05E1\u05E3 \u05D3\u05D9\u05D5\u05D5\u05D7 \u05E9\u05E2\u05D5\u05EA \u05E9\u05DC " + d.get("rep"));
        break;
      }
      case "call":
        s.call = String(d.get("call"));
        s.callDone = true;
        log("\u05EA\u05D5\u05E2\u05D3 \u05E1\u05D9\u05DB\u05D5\u05DD \u05E9\u05D9\u05D7\u05D4 \u05E2\u05DD \u05DE\u05E9\u05E4\u05D7\u05EA \u05DC\u05D5\u05D9");
        message = "\u05E1\u05D9\u05DB\u05D5\u05DD \u05D4\u05E9\u05D9\u05D7\u05D4 \u05EA\u05D5\u05E2\u05D3";
        break;
      case "analysis-draft":
        nav("pro/preview");
        return;
      case "analysis":
        if (["submitted", "approved"].includes(s.analysis.status)) return;
        if (!["current", "proposal", "summary"].every((k) => s.analysis[k]?.trim())) {
          toast("\u05D9\u05E9 \u05DC\u05D4\u05E9\u05DC\u05D9\u05DD \u05D0\u05EA \u05D4\u05DE\u05DE\u05E6\u05D0\u05D9\u05DD \u05D5\u05D4\u05E1\u05D9\u05DB\u05D5\u05DD");
          nav("pro/write");
          return;
        }
        s.analysis.status = "submitted";
        log("\u05D3\u05D5\u05D3 \u05D0\u05DC\u05D5\u05DF \u05D4\u05D2\u05D9\u05E9 \u05E0\u05D9\u05EA\u05D5\u05D7 \u05DC\u05DE\u05E9\u05E4\u05D7\u05EA \u05DC\u05D5\u05D9");
        message = "\u05D4\u05E0\u05D9\u05EA\u05D5\u05D7 \u05DE\u05DE\u05EA\u05D9\u05DF \u05DB\u05E2\u05EA \u05DC\u05D1\u05D3\u05D9\u05E7\u05EA \u05D4\u05E0\u05E6\u05D9\u05D2";
        break;
      case "return":
        s.reason = String(d.get("reason"));
        s.analysis.status = "returned";
        log("\u05E0\u05D9\u05EA\u05D5\u05D7 \u05DE\u05E9\u05E4\u05D7\u05EA \u05DC\u05D5\u05D9 \u05D4\u05D5\u05D7\u05D6\u05E8 \u05DC\u05D4\u05E9\u05DC\u05DE\u05D4");
        break;
      case "assign":
        s.assignment = String(d.get("assignee"));
        log("\u05DE\u05E9\u05E4\u05D7\u05EA \u05DB\u05D4\u05DF \u05E9\u05D5\u05D9\u05DB\u05D4 \u05DC\u05D3\u05D5\u05D3 \u05D0\u05DC\u05D5\u05DF");
        break;
      case "member": {
        const m = s.members.find((x) => x.id === form.dataset.id);
        m.name = String(d.get("name"));
        m.active = d.has("active");
        for (const k of m.id === "david" ? ["analysis", "execution"] : ["all", "approve"]) m[k] = d.has(k);
        log("\u05E2\u05D5\u05D3\u05DB\u05E0\u05D5 \u05D4\u05D2\u05D3\u05E8\u05D5\u05EA \u05D4\u05D4\u05D3\u05D2\u05DE\u05D4 \u05E9\u05DC " + m.name);
        break;
      }
      case "service":
        s.service = { name: String(d.get("name")), analysis: Number(d.get("analysis")), execution: Number(d.get("execution")) };
        log("\u05E2\u05D5\u05D3\u05DB\u05E0\u05D5 \u05D4\u05D2\u05D3\u05E8\u05D5\u05EA \u05E9\u05D9\u05E8\u05D5\u05EA \u05D4\u05D1\u05D9\u05D8\u05D5\u05D7\u05D9\u05DD");
        break;
      case "request":
        s.requests[form.dataset.scope] = String(d.get("request"));
        log("\u05E0\u05E8\u05E9\u05DE\u05D4 \u05D1\u05E7\u05E9\u05EA \u05DE\u05D9\u05D3\u05E2: " + (form.dataset.scope === "accepted" ? "\u05DE\u05E9\u05E4\u05D7\u05EA \u05DB\u05D4\u05DF" : "\u05DE\u05E9\u05E4\u05D7\u05EA \u05DC\u05D5\u05D9"));
        message = "\u05D4\u05D1\u05E7\u05E9\u05D4 \u05EA\u05D5\u05E2\u05D3\u05D4 \u05D1\u05D4\u05D3\u05D2\u05DE\u05D4";
        break;
      case "doc-return":
        s.docs.salary = "rejected";
        log("\u05E0\u05D3\u05E8\u05E9\u05D4 \u05D4\u05E9\u05DC\u05DE\u05D4 \u05DC\u05EA\u05DC\u05D5\u05E9 \u05D4\u05E9\u05DB\u05E8: " + d.get("reason"));
        break;
      case "execution-note":
        s.execution.note = String(d.get("note"));
        s.execution.status = String(d.get("status"));
        s.execution.history.unshift(s.execution.note);
        log("\u05EA\u05D5\u05E2\u05D3 \u05E2\u05D3\u05DB\u05D5\u05DF \u05D1\u05D1\u05D9\u05E6\u05D5\u05E2 \u05DC\u05DE\u05E9\u05E4\u05D7\u05EA \u05E8\u05D6");
        break;
      case "execution-complete":
        s.execution.outcome = String(d.get("outcome"));
        s.execution.summary = String(d.get("summary"));
        s.execution.status = "reported";
        s.execution.history.unshift("\u05D3\u05D9\u05D5\u05D5\u05D7 \u05D4\u05E1\u05D9\u05D5\u05DD \u05D4\u05D5\u05D2\u05E9 \u05DC\u05E0\u05E6\u05D9\u05D2");
        log("\u05D4\u05D5\u05D2\u05E9 \u05D3\u05D9\u05D5\u05D5\u05D7 \u05E1\u05D9\u05D5\u05DD \u05DC\u05DE\u05E9\u05E4\u05D7\u05EA \u05E8\u05D6");
        message = "\u05D3\u05D9\u05D5\u05D5\u05D7 \u05D4\u05E1\u05D9\u05D5\u05DD \u05DE\u05DE\u05EA\u05D9\u05DF \u05DC\u05D0\u05D9\u05E9\u05D5\u05E8 \u05E0\u05E6\u05D9\u05D2";
        break;
    }
    if ($("#dialog").open) $("#dialog").close();
    persist();
    rerender();
    toast(message);
  });
  window.addEventListener("hashchange", (e) => {
    const r = decodeURIComponent(location.hash.slice(1) || "rep/home");
    const old = decodeURIComponent(new URL(e.oldURL).hash.slice(1) || "rep/home");
    const same = !!scrollGroup(r) && scrollGroup(r) === scrollGroup(old);
    const snapshot = pendingScroll?.route === r ? pendingScroll.snapshot : scrollPositions.get(r) || (same ? scrollPositions.get(old) : null);
    pendingScroll = null;
    restoringScroll = true;
    render();
    restoreScroll(r, snapshot);
  });
  document.body.insertAdjacentHTML("afterbegin", iconDefs);
  render();
  $("#dialog").addEventListener("close", () => {
    $("#dialog-body").innerHTML = "";
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.financeDetail) modal("\u05E4\u05D9\u05E8\u05D5\u05D8 \u05D4\u05E8\u05E9\u05D5\u05DE\u05D4", financeDetail(b.dataset.financeDetail, { s, esc }));
    if (b.dataset.profitDetail) {
      const rows = financeRows(s.finance, s.reportFilter);
      const family2 = b.dataset.profitDetail;
      modal("\u05DE\u05E7\u05D5\u05E8\u05D5\u05EA \u05D4\u05E2\u05DC\u05D5\u05EA \u2014 \u05DE\u05E9\u05E4\u05D7\u05EA " + family2, `<p>\u05D4\u05E8\u05E9\u05D5\u05DE\u05D5\u05EA \u05E9\u05E0\u05DB\u05DC\u05DC\u05D5\u05EA \u05D1\u05E1\u05D9\u05E0\u05D5\u05DF \u05D4\u05E0\u05D5\u05DB\u05D7\u05D9.</p>${[...rows.invoices, ...rows.expenses, ...rows.hours.filter((x) => x.approved)].filter((x) => x.family === family2).map((x) => `<div class="ledger-source"><span>${x.id} \xB7 ${esc(x.service || x.task)}</span>${B("\u05E4\u05D9\u05E8\u05D5\u05D8", `data-finance-detail="${x.id}"`, "text")}</div>`).join("")}`);
    }
    if (b.dataset.approveHours) {
      const entry = s.finance.hours.find((x) => x.id === b.dataset.approveHours);
      if (entry && !entry.approved) {
        entry.approved = true;
        log("\u05D0\u05D5\u05E9\u05E8\u05D5 \u05E9\u05E2\u05D5\u05EA " + entry.rep + " / \u05DE\u05E9\u05E4\u05D7\u05EA " + entry.family);
        rerender();
        toast("\u05D4\u05E9\u05E2\u05D5\u05EA \u05D0\u05D5\u05E9\u05E8\u05D5 \u05D1\u05D4\u05D3\u05D2\u05DE\u05D4");
      }
    }
    if (b.hasAttribute("data-add-hours")) {
      modal("\u05D3\u05D9\u05D5\u05D5\u05D7 \u05E9\u05E2\u05D5\u05EA \u05DC\u05D3\u05D5\u05D2\u05DE\u05D4", `<form data-form="hours"><label>\u05E0\u05E6\u05D9\u05D2<select name="rep"><option>\u05D9\u05E9\u05E8\u05D0\u05DC \u05DB\u05D4\u05DF</option><option>\u05DE\u05E8\u05D9\u05DD \u05DC\u05D5\u05D9</option></select></label><label>\u05DE\u05E9\u05E4\u05D7\u05D4<select name="family"><option>\u05DC\u05D5\u05D9</option><option>\u05DB\u05D4\u05DF</option><option>\u05E8\u05D6</option></select></label><label>\u05EA\u05D0\u05E8\u05D9\u05DA<input type="date" name="date" value="2026-10-31" required></label><label>\u05EA\u05D9\u05D0\u05D5\u05E8 \u05D4\u05E2\u05D1\u05D5\u05D3\u05D4<input name="task" required maxlength="150"></label><label>\u05DE\u05E9\u05DA \u05D1\u05D3\u05E7\u05D5\u05EA<input type="number" name="minutes" min="1" max="720" step="1" required></label><p class="hint">\u05D3\u05D9\u05D5\u05D5\u05D7 \u05D9\u05D3\u05E0\u05D9. \u05D9\u05D5\u05E4\u05D9\u05E2 \u05DB\u05DE\u05DE\u05EA\u05D9\u05DF \u05DC\u05D0\u05D9\u05E9\u05D5\u05E8.</p>${B("\u05E9\u05DE\u05D9\u05E8\u05EA \u05D4\u05D3\u05D9\u05D5\u05D5\u05D7", 'type="submit"', "primary")}</form>`);
    }
    if (b.dataset.exportReport) {
      const csv = csvReport(b.dataset.exportReport, financeRows(s.finance, s.reportFilter));
      const u = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = u;
      a.download = "\u05D3\u05D5\u05D7-" + b.dataset.exportReport + "-" + s.reportFilter.month + ".csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(u), 1e3);
      toast("\u05D4\u05D3\u05D5\u05D7 \u05D4\u05DE\u05E1\u05D5\u05E0\u05DF \u05D9\u05D5\u05E6\u05D0 \u05DC\u05E7\u05D5\u05D1\u05E5 CSV");
    }
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest("[data-export-performance]")) return;
    const data = [["\u05DE\u05E9\u05E4\u05D7\u05D4", "\u05E0\u05E6\u05D9\u05D2", "\u05DE\u05D8\u05E4\u05DC", "\u05EA\u05D7\u05D5\u05DD", "\u05DE\u05E6\u05D1", "\u05D4\u05E6\u05E2\u05D3 \u05D4\u05D1\u05D0"], ...performanceRows(s).map((x) => [x.family, x.rep, x.owner, x.stage, x.status, x.next])];
    const csv = "\uFEFF" + data.map((r) => r.map((x) => '"' + String(x).replaceAll('"', '""') + '"').join(",")).join("\r\n");
    const u = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = u;
    a.download = "\u05DE\u05E6\u05D1-\u05E2\u05D1\u05D5\u05D3\u05D4-\u05DC\u05D3\u05D5\u05D2\u05DE\u05D4.csv";
    a.click();
    setTimeout(() => URL.revokeObjectURL(u), 1e3);
  });
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-work-detail]");
    if (!b) return;
    const r = performanceRows(s).find((x) => x.family === b.dataset.workDetail);
    if (!r) return;
    modal("\u05DE\u05E6\u05D1 \u05D4\u05E2\u05D1\u05D5\u05D3\u05D4 \u2014 " + r.family, `<span class="eyebrow">\u05EA\u05E6\u05D5\u05D2\u05EA \u05DE\u05E0\u05D4\u05DC</span><dl class="ledger-detail">${[["\u05E0\u05E6\u05D9\u05D2 \u05DE\u05DC\u05D5\u05D5\u05D4", r.rep], ["\u05DE\u05D8\u05E4\u05DC \u05D1\u05E9\u05DC\u05D1", r.owner], ["\u05DE\u05E6\u05D1", r.status], ["\u05D4\u05E6\u05E2\u05D3 \u05D4\u05D1\u05D0", r.next]].map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>${r.family === "\u05DE\u05E9\u05E4\u05D7\u05EA \u05DB\u05D4\u05DF" && !s.assignment ? B("\u05E9\u05D9\u05D5\u05DA \u05D1\u05E2\u05DC \u05DE\u05E7\u05E6\u05D5\u05E2", 'data-act="assign"', "primary") : ""}`);
  });
})();
</script></body></html>
