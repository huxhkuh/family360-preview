  function stageSeed(base, key) {

      s.tasks = s.tasks.map((t) => ({ ...t, status: "completed" }));

 <nav class="home-links" aria-label="\u05D2\u05D9\u05E9\u05D4 \u05DE\u05D4\u05D9\u05E8\u05D4"><button data-route="case/tasks">${icon("tasks")}<strong>\u05D4\u05E4\u05E2\u05D5\u05DC\u05D5\u05EA \u05E9\u05DC\u05E0\u05D5</strong><small>\u05D4\u05DE\u05E9\u05D9\u05DE\u05D5\u05EA \u05D5\u05D4\u05E6\u05E2\u05D3\u05D9\u05DD \u05DC\u05D4\u05DE\u05E9\u05DA</small></button><button data-route="case/documents">${icon("documents")}<strong>\u05D4\u05DE\u05E1\u05DE\u05DB\u05D9\u05DD \u05E9\u05DC\u05D9</strong><small>\u05DB\u05DC \u05D4\u05DE\u05E1\u05DE\u05DB\u05D9\u05DD \u05D5\u05D4\u05D8\u05E4\u05E1\u05D9\u05DD</small></button><button data-route="case/services">${icon("report")}<strong>\u05D1\u05D8\u05D9\u05E4\u05D5\u05DC \u05E9\u05DC \u05D9\u05E9\u05E8\u05D0\u05DC</strong><small>\u05D4\u05D1\u05D3\u05D9\u05E7\u05D5\u05EA \u05D5\u05D4\u05D4\u05DE\u05DC\u05E6\u05D5\u05EA</small></button><button data-route="case/meetings">${icon("questionnaire")}<strong>\u05E9\u05D9\u05D7\u05D5\u05EA \u05D5\u05E1\u05D9\u05DB\u05D5\u05DE\u05D9\u05DD</strong><small>\u05D4\u05E2\u05D3\u05DB\u05D5\u05E0\u05D9\u05DD \u05D5\u05D4\u05D4\u05D7\u05DC\u05D8\u05D5\u05EA</small></button></nav></div>`;
  }
  function documents() {
    const list = state.docs.filter((d) => filter === "all" || (filter === "action" ? ["missing", "rejected"].includes(d.status) : d.status === filter));
    return `<div class="sheet-heading"><div><span class="eyebrow">\u05D4\u05EA\u05D9\u05E7 \u05D4\u05DE\u05E9\u05E4\u05D7\u05EA\u05D9</span><h2>\u05D4\u05DE\u05E1\u05DE\u05DB\u05D9\u05DD \u05E9\u05DC\u05E0\u05D5</h2></div><label class="filter-label">\u05D4\u05E6\u05D2\u05D4<select id="doc-filter">${[["all", "\u05DB\u05DC \u05D4\u05DE\u05E1\u05DE\u05DB\u05D9\u05DD"], ["action", "\u05DC\u05D4\u05E9\u05DC\u05DE\u05D4"], ["pending", "\u05D1\u05D1\u05D3\u05D9\u05E7\u05D4"], ["approved", "\u05D0\u05D5\u05E9\u05E8\u05D5"]].map(([k, l]) => `<option value="${k}" ${filter === k ? "selected" : ""}>${l}</option>`).join("")}</select></label></div><div class="document-list">${list.length ? list.map((d) => `<div class="row document-row ${["missing", "rejected"].includes(d.status) && !d.optional ? "needs-action" : ""}"><span class="document-symbol">${icon(d.signature ? "check" : "documents")}</span><div class="document-copy"><h3>${esc(d.name)}</h3><small>${d.optional ? "\u05E8\u05E9\u05D5\u05EA" : esc(d.period || "")}</small>${d.file ? `<p class="filename">${esc(d.file)}</p>` : ""}${d.reason ? `<p class="rejection-reason">${esc(d.reason)}</p>` : ""}</div><div class="row-actions">${badge(d)}${go("document/" + d.id, ["missing", "rejected"].includes(d.status) ? "\u05D4\u05E9\u05DC\u05DE\u05D4" : "\u05E6\u05E4\u05D9\u05D9\u05D4", "secondary")}</div></div>`).join("") : `<div class="empty-state">${icon("documents")}<p>\u05D0\u05D9\u05DF \u05DE\u05E1\u05DE\u05DB\u05D9\u05DD \u05D1\u05DE\u05E6\u05D1 \u05D4\u05D6\u05D4.</p></div>`}</div><div class="sheet-footer">${go("help", "\u05E2\u05D6\u05E8\u05D4 \u05E2\u05DD \u05DE\u05E1\u05DE\u05DA")}</div>`;
  }
  function documentPage(id) {
    const d = state.docs.find((x) => x.id === id);
    if (!d) return shell("<h1>\u05D4\u05DE\u05E1\u05DE\u05DA \u05DC\u05D0 \u05E0\u05DE\u05E6\u05D0</h1>" + go("case/documents", "\u05DC\u05DB\u05DC \u05D4\u05DE\u05E1\u05DE\u05DB\u05D9\u05DD"));
    return shell(`<div class="eyebrow">\u05D4\u05DE\u05E1\u05DE\u05DB\u05D9\u05DD \u05E9\u05DC\u05E0\u05D5 / ${d.optional ? "\u05E8\u05E9\u05D5\u05EA" : "\u05D1\u05E7\u05E9\u05D4 \u05DE\u05D9\u05E9\u05E8\u05D0\u05DC"}</div><div class="document-heading">${icon(d.signature ? "check" : "documents")}<h1>${esc(d.name)}</h1></div>${badge(d)}<p style="font-size:20px;margin-top:23px">${esc(d.purpose)}</p>${d.reason ? `<div class="notice error"><strong>\u05D4\u05E2\u05E8\u05D4 \u05DE\u05D9\u05E9\u05E8\u05D0\u05DC</strong><br>${esc(d.reason)}</div>` : ""}${d.signature ? consent(d) : `<dl class="facts"><div><dt>\u05E2\u05D1\u05D5\u05E8 \u05DE\u05D9</dt><dd>${esc(d.subject)}</dd></div><div><dt>\u05DC\u05D0\u05D9\u05D6\u05D5 \u05EA\u05E7\u05D5\u05E4\u05D4</dt><dd>${esc(d.period)}</dd></div><div class="full"><dt>\u05D0\u05D9\u05E4\u05D4 \u05DE\u05D5\u05E6\u05D0\u05D9\u05DD \u05D0\u05EA \u05D4\u05DE\u05E1\u05DE\u05DA?</dt><dd>${esc(d.source)}</dd></div></dl>${d.file ? `<div class="notice"><strong>${esc(d.file)}</strong><p>${d.status === "pending" ? "\u05D4\u05E7\u05D5\u05D1\u05E5 \u05E6\u05D5\u05E8\u05E3 \u05D5\u05DE\u05DE\u05EA\u05D9\u05DF \u05DC\u05D1\u05D3\u05D9\u05E7\u05D4. \u05D0\u05D9\u05DF \u05E6\u05D5\u05E8\u05DA \u05DC\u05E6\u05E8\u05E3 \u05D0\u05D5\u05EA\u05D5 \u05E9\u05D5\u05D1." : d.status === "approved" ? "\u05D4\u05DE\u05E1\u05DE\u05DA \u05D0\u05D5\u05E9\u05E8 \u05D5\u05E0\u05DE\u05E6\u05D0 \u05D1\u05EA\u05D9\u05E7." : "\u05D4\u05DE\u05E1\u05DE\u05DA \u05D4\u05E7\u05D5\u05D3\u05DD \u05E0\u05E9\u05DE\u05E8 \u05E2\u05D3 \u05DC\u05E6\u05D9\u05E8\u05D5\u05E3 \u05D4\u05D2\u05E8\u05E1\u05D4 \u05D4\u05DE\u05EA\u05D5\u05E7\u05E0\u05EA."}</p><div class="row-actions">${B("\u05EA\u05E6\u05D5\u05D2\u05D4 \u05DE\u05E7\u05D3\u05D9\u05DE\u05D4", `data-preview="${d.id}"`, "secondary")}${B("\u05D4\u05D5\u05E8\u05D3\u05EA \u05D4\u05E7\u05D5\u05D1\u05E5", `data-download="${d.id}"`, "text")}</div></div>` : ""}${["missing", "rejected"].includes(d.status) ? upload(d) : `<details><summary>\u05D4\u05D7\u05DC\u05E4\u05EA \u05E7\u05D5\u05D1\u05E5</summary><p>\u05D4\u05E7\u05D5\u05D1\u05E5 \u05D4\u05D7\u05D3\u05E9 \u05D9\u05D7\u05DC\u05D9\u05E3 \u05D0\u05EA \u05D4\u05E7\u05D5\u05D3\u05DD \u05D5\u05D9\u05D7\u05D6\u05D5\u05E8 \u05DC\u05D1\u05D3\u05D9\u05E7\u05EA \u05D4\u05E0\u05E6\u05D9\u05D2.</p>${upload(d)}</details>`}`}<div class="formfoot">${go("help", "\u05E6\u05E8\u05D9\u05DB\u05D9\u05DD \u05E2\u05D6\u05E8\u05D4 \u05E2\u05DD \u05D4\u05D1\u05E7\u05E9\u05D4?")}${go("home", "\u05D7\u05D6\u05E8\u05D4 \u05DC\u05D0\u05D6\u05D5\u05E8 \u05D4\u05D0\u05D9\u05E9\u05D9", "secondary")}</div>`);
  }
  function upload(d) {
    return `<div class="upload-zone">${icon("upload")}<h3>\u05E6\u05D9\u05E8\u05D5\u05E3 \u05DE\u05E1\u05DE\u05DA</h3><p>PDF \u05D0\u05D5 \u05EA\u05DE\u05D5\u05E0\u05D4 \xB7 \u05E2\u05D3 20MB<br><small>\u05D4\u05E7\u05D5\u05D1\u05E5 \u05E0\u05E9\u05DE\u05E8 \u05D1\u05D3\u05E4\u05D3\u05E4\u05DF.</small></p><label>\u05D1\u05D7\u05D9\u05E8\u05EA \u05E7\u05D5\u05D1\u05E5<input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.webp" data-doc="${d.id}"></label><p id="file-message" role="status"></p>${B("\u05E6\u05D9\u05E8\u05D5\u05E3 \u05DC\u05EA\u05D9\u05E7", `id="attach" data-attach="${d.id}" disabled`)}<div style="margin-top:15px">${B("\u05E9\u05D9\u05DE\u05D5\u05E9 \u05D1\u05DE\u05E1\u05DE\u05DA \u05D3\u05D5\u05D2\u05DE\u05D4", `data-example="${d.id}"`, "text")}</div></div>`;
  }
  function consent(d) {
    return d.status === "signed" ? `<div class="notice">\u05D4\u05E1\u05DB\u05DE\u05D4 \u05DC\u05D3\u05D5\u05D2\u05DE\u05D4 \u05EA\u05D5\u05E2\u05D3\u05D4 \u05D1\u05E9\u05DD ${esc(d.signer)} \u05D1\u05EA\u05D0\u05E8\u05D9\u05DA ${esc(d.signedAt)}. \u05D0\u05D9\u05DF \u05D6\u05D5 \u05D4\u05E8\u05E9\u05D0\u05D4 \u05EA\u05E7\u05E4\u05D4 \u05D0\u05D5 \u05D7\u05EA\u05D9\u05DE\u05D4 \u05D3\u05D9\u05D2\u05D9\u05D8\u05DC\u05D9\u05EA.</div>` : `<div class="notice">\u05E0\u05D5\u05E1\u05D7 \u05D4\u05D3\u05D2\u05DE\u05D4 \u05D1\u05DC\u05D1\u05D3: \u05D0\u05E0\u05D9 \u05DE\u05E1\u05DB\u05D9\u05DD/\u05D4 \u05DC\u05EA\u05E2\u05D3 \u05D1\u05DE\u05E1\u05D2\u05E8\u05EA \u05D0\u05D1\u05BE\u05D4\u05D8\u05D9\u05E4\u05D5\u05E1 \u05D1\u05E7\u05E9\u05D4 \u05DC\u05D1\u05D9\u05E8\u05D5\u05E8 \u05DE\u05D9\u05D3\u05E2. \u05DC\u05D0 \u05EA\u05D9\u05E9\u05DC\u05D7 \u05E4\u05E0\u05D9\u05D9\u05D4 \u05DC\u05DE\u05E1\u05DC\u05E7\u05D4 \u05D0\u05D5 \u05DC\u05D2\u05D5\u05E8\u05DD \u05D7\u05D9\u05E6\u05D5\u05E0\u05D9 \u05D5\u05DC\u05D0 \u05EA\u05D9\u05E0\u05EA\u05DF \u05D4\u05E8\u05E9\u05D0\u05D4 \u05D0\u05DE\u05D9\u05EA\u05D9\u05EA.</div><form id="consent-form"><label>\u05E9\u05DD \u05DE\u05DC\u05D0<input name="signer" required minlength="2" maxlength="150"></label><label><input type="checkbox" name="agree" required> \u05E7\u05E8\u05D0\u05EA\u05D9 \u05D0\u05EA \u05E0\u05D5\u05E1\u05D7 \u05D4\u05D4\u05D3\u05D2\u05DE\u05D4 \u05D5\u05D0\u05E0\u05D9 \u05DE\u05E1\u05DB\u05D9\u05DD/\u05D4 \u05DC\u05EA\u05D9\u05E2\u05D5\u05D3 \u05DE\u05E7\u05D5\u05DE\u05D9.</label><div class="formfoot">${B("\u05EA\u05D9\u05E2\u05D5\u05D3 \u05D4\u05D4\u05E1\u05DB\u05DE\u05D4 \u05D1\u05D4\u05D3\u05DE\u05D9\u05D4")}</div></form>`;
  }
  function tasks() {
    return `<div class="section-title"><span class="eyebrow">\u05D4\u05EA\u05D9\u05E7 \u05D4\u05DE\u05E9\u05E4\u05D7\u05EA\u05D9</span><h2>\u05D4\u05E4\u05E2\u05D5\u05DC\u05D5\u05EA \u05E9\u05DC\u05E0\u05D5</h2></div>${!state.submitted ? `<div class="row"><div><h3>\u05D4\u05E9\u05DC\u05DE\u05EA \u05D4\u05E9\u05D0\u05DC\u05D5\u05DF</h3><p>\u05D4\u05D8\u05D9\u05D5\u05D8\u05D4 \u05E9\u05DE\u05D5\u05E8\u05D4 \u05DC\u05D4\u05DE\u05E9\u05DA \u05DE\u05D9\u05DC\u05D5\u05D9.</p></div>${badge({ status: "open" })}${go("case/questionnaire", "\u05D4\u05DE\u05E9\u05DA \u05DE\u05D9\u05DC\u05D5\u05D9", "secondary")}</div>` : ""}${state.docs.filter((d) => !d.optional).map((d) => `<div class="row"><div><h3>${["pending", "approved"].includes(d.status) ? esc(d.name) : "\u05E6\u05D9\u05E8\u05D5\u05E3 " + esc(d.name)}</h3><p>${d.status === "rejected" ? esc(d.reason) : esc(d.period || "")}</p></div>${badge({ status: ["pending", "approved"].includes(d.status) ? "completed" : "open" })}${go("document/" + d.id, "\u05DC\u05DE\u05E1\u05DE\u05DA", "secondary")}</div>`).join("")}${state.tasks.map((t) => `<div class="row"><div><h3>${esc(t.title)}</h3><p>${esc(t.details)}</p><small>\u05D1\u05D0\u05D7\u05E8\u05D9\u05D5\u05EA \u05D4\u05DE\u05E9\u05E4\u05D7\u05D4 \xB7 \u05E2\u05D3 ${t.due}</small>${t.correction ? '<p class="notice">\u05D1\u05E7\u05E9\u05EA \u05D4\u05EA\u05D9\u05E7\u05D5\u05DF \u05E8\u05E9\u05D5\u05DE\u05D4 \u05D0\u05E6\u05DC \u05D9\u05E9\u05E8\u05D0\u05DC.</p>' : ""}</div><div>${badge(t)}${t.status !== "completed" ? `<select aria-label="\u05DE\u05E6\u05D1 \u05D4\u05E4\u05E2\u05D5\u05DC\u05D4" data-task="${t.id}">${[["open", "\u05DE\u05DE\u05EA\u05D9\u05E0\u05D4"], ["in_progress", "\u05D4\u05EA\u05D7\u05DC\u05E0\u05D5 \u05DC\u05D8\u05E4\u05DC"], ["completed", "\u05D4\u05D5\u05E9\u05DC\u05DD"]].map(([v, l]) => `<option value="${v}" ${t.status === v ? "selected" : ""}>${l}</option>`).join("")}</select>` : !t.correction ? B("\u05E1\u05D9\u05DE\u05E0\u05D5 \u05D1\u05D8\u05E2\u05D5\u05EA \u2014 \u05D1\u05E7\u05E9\u05EA \u05EA\u05D9\u05E7\u05D5\u05DF", `data-correct="${t.id}"`, "text") : ""}</div></div>`).join("")}<h3 style="margin-top:35px">\u05D1\u05D8\u05D9\u05E4\u05D5\u05DC \u05E2\u05D1\u05D5\u05E8\u05E0\u05D5</h3><p>\u05D9\u05E9\u05E8\u05D0\u05DC \u05DB\u05D4\u05DF \xB7 \u05D1\u05D3\u05D9\u05E7\u05EA \u05D6\u05DB\u05D5\u05D9\u05D5\u05EA \u05D5\u05E1\u05E7\u05D9\u05E8\u05EA \u05E4\u05E8\u05D8\u05D9 \u05D4\u05DE\u05E9\u05E4\u05D7\u05D4.</p>${state.help.map((h) => `<div class="row"><div><strong>${esc(h.text)}</strong><p class="muted">\u05D1\u05E7\u05E9\u05EA \u05E2\u05D6\u05E8\u05D4 \xB7 ${esc(h.time)}</p></div><span class="badge">\u05DE\u05DE\u05EA\u05D9\u05E0\u05D4 \u05DC\u05E0\u05E6\u05D9\u05D2</span></div>`).join("")}`;

  function services() {

          dialog("\u05D1\u05E7\u05E8\u05D5\u05EA \u05D4\u05D4\u05D3\u05DE\u05D9\u05D4", `<p>\u05D4\u05E4\u05E2\u05D5\u05DC\u05D5\u05EA \u05DB\u05D0\u05DF \u05DE\u05D3\u05DE\u05D5\u05EA \u05D0\u05EA \u05D4\u05E6\u05D3 \u05E9\u05DC \u05D4\u05E0\u05E6\u05D9\u05D2. \u05D4\u05DF \u05D0\u05D9\u05E0\u05DF \u05D7\u05DC\u05E7 \u05DE\u05D4\u05D0\u05D6\u05D5\u05E8 \u05D4\u05D0\u05D9\u05E9\u05D9 \u05E9\u05DC \u05D4\u05DC\u05E7\u05D5\u05D7.</p><h3>\u05EA\u05DC\u05D5\u05E9 \u05D4\u05E9\u05DB\u05E8</h3><p>\u05DE\u05E6\u05D1 \u05E0\u05D5\u05DB\u05D7\u05D9: ${names[state.docs[0].status]}</p><div class="row-actions">${B("\u05D4\u05E0\u05E6\u05D9\u05D2 \u05DE\u05D0\u05E9\u05E8", `data-review="approved" ${state.docs[0].status !== "pending" ? "disabled" : ""}`)}${B("\u05D4\u05E0\u05E6\u05D9\u05D2 \u05DE\u05D1\u05E7\u05E9 \u05EA\u05D9\u05E7\u05D5\u05DF", `data-review="rejected" ${state.docs[0].status !== "pending" ? "disabled" : ""}`, "secondary")}</div><h3 style="margin-top:28px">\u05DE\u05E6\u05D1\u05D9\u05DD \u05E0\u05D5\u05E1\u05E4\u05D9\u05DD</h3><div class="row-actions">${B("\u05D4\u05E4\u05E2\u05DC\u05EA \u05D3\u05D5\u05D7 \u05DE\u05D0\u05D5\u05E9\u05E8", 'data-act="approve-report"', "secondary")}${B("\u05D4\u05E9\u05D0\u05DC\u05D5\u05DF \u05E2\u05D3\u05D9\u05D9\u05DF \u05D1\u05D8\u05D9\u05D5\u05D8\u05D4", 'data-act="draft-q"', "secondary")}${B("\u05D0\u05D9\u05E4\u05D5\u05E1 \u05D4\u05D4\u05D3\u05DE\u05D9\u05D4", 'data-act="confirm-reset"', "text")}</div><p class="muted">\u05D4\u05E9\u05D0\u05DC\u05D5\u05DF \u05DE\u05E9\u05EA\u05DE\u05E9 \u05D1\u05D4\u05D2\u05D3\u05E8\u05D4 \u05D5\u05D1\u05D0\u05D9\u05DE\u05D5\u05EA \u05DE\u05D4\u05DE\u05E2\u05E8\u05DB\u05EA \u05D4\u05E7\u05D9\u05D9\u05DE\u05EA. \u05D6\u05E8\u05D9\u05DE\u05D5\u05EA \u05D4\u05D8\u05D9\u05E4\u05D5\u05DC \u05DB\u05D0\u05DF \u05D4\u05DF \u05D4\u05D3\u05DE\u05D9\u05D4 \u05E2\u05E6\u05DE\u05D0\u05D9\u05EA; \u05D0\u05D9\u05DF \u05D4\u05EA\u05D7\u05D1\u05E8\u05D5\u05EA \u05DC\u05E9\u05E8\u05EA, \u05EA\u05E9\u05DC\u05D5\u05DD \u05D0\u05D5 \u05E9\u05DC\u05D9\u05D7\u05D4 \u05DC\u05E0\u05E6\u05D9\u05D2.</p>`);
          break;
        case "approve-report":
          state.report = true;
          event("\u05D3\u05D5\u05D7 \u05DC\u05D3\u05D5\u05D2\u05DE\u05D4 \u05D0\u05D5\u05E9\u05E8");
          $("#dialog").close();
          render();
          break;
        case "draft-q":
          state.submitted = false;
          persist();
          $("#dialog").close();
          nav("home");
          break;
        case "confirm-reset":
          $("#dialog-body").innerHTML = "<p>\u05D4\u05D0\u05D9\u05E4\u05D5\u05E1 \u05D9\u05DE\u05D7\u05E7 \u05D0\u05EA \u05D4\u05E9\u05D9\u05E0\u05D5\u05D9\u05D9\u05DD \u05D5\u05E7\u05D5\u05D1\u05E6\u05D9 \u05D4\u05D4\u05D3\u05D2\u05DE\u05D4 \u05E9\u05E9\u05DE\u05E8\u05EA\u05DD \u05D1\u05D0\u05D1\u05BE\u05D4\u05D8\u05D9\u05E4\u05D5\u05E1 \u05D4\u05D6\u05D4 \u05D1\u05DC\u05D1\u05D3.</p>" + B("\u05DB\u05DF, \u05DC\u05D0\u05E4\u05E1", 'data-act="reset"') + B("\u05D1\u05D9\u05D8\u05D5\u05DC", 'data-act="close"', "secondary");
          break;
        case "reset":
          await fileStore("clear");
          state = seed();
          persist();
          $("#dialog").close();
          nav("home");
          render();
          break;
        case "calendar": {
          const ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:demo-family-meeting@mesudarim.local\r\nDTSTAMP:20261028T080000Z\r\nDTSTART:20261029T080000Z\r\nDTEND:20261029T083000Z\r\nSUMMARY:\u05E9\u05D9\u05D7\u05EA \u05D4\u05DE\u05E9\u05DA \u05E2\u05DD \u05D9\u05E9\u05E8\u05D0\u05DC \u2014 \u05D4\u05D3\u05D2\u05DE\u05D4\r\nDESCRIPTION:\u05D0\u05D9\u05E8\u05D5\u05E2 \u05DC\u05D3\u05D5\u05D2\u05DE\u05D4 \u05DE\u05EA\u05D5\u05DA \u05D0\u05D1 \u05D8\u05D9\u05E4\u05D5\u05E1 \u05DE\u05E7\u05D5\u05DE\u05D9\r\nEND:VEVENT\r\nEND:VCALENDAR";
          const u = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
          const a = document.createElement("a");
          a.href = u;
          a.download = "\u05E9\u05D9\u05D7\u05EA-\u05D4\u05DE\u05E9\u05DA-\u05DC\u05D3\u05D5\u05D2\u05DE\u05D4.ics";
          a.click();
          setTimeout(() => URL.revokeObjectURL(u), 1e3);
          break;
        }
      }
    } catch (err) {
      console.error(err);
      toast("\u05D4\u05E4\u05E2\u05D5\u05DC\u05D4 \u05DC\u05D0 \u05D4\u05D5\u05E9\u05DC\u05DE\u05D4. \u05E0\u05E1\u05D5 \u05E9\u05D5\u05D1.");
    }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset.answer && !el.dataset.multi && el.tagName !== "SELECT") {
      setAnswer(el.dataset.answer, el.value);
      persist();
    }
    if (el.id === "meeting-notes") {
      state.notes = el.value;
      persist();
    }
    if (el.id === "help-draft") {
      state.helpDraft = el.value;
      persist();
    }
  });
  function setAnswer(path, v) {
    const ps = path.split(".");
    let obj = state.answers;
    for (const p of ps.slice(0, -1)) obj = obj[p];
    obj[ps.at(-1)] = v;
    state.submitted = false;
  }
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.id === "folder-select") nav("case/" + el.value);
    if (el.id === "file-input") {
      selectedFile = el.files[0];
      const valid = selectedFile && selectedFile.size > 0 && selectedFile.size <= 20 * 1024 * 1024 && /\.(pdf|png|jpe?g|webp)$/i.test(selectedFile.name);
      $("#file-message").textContent = valid ? selectedFile.name : selectedFile ? "\u05D9\u05E9 \u05DC\u05D1\u05D7\u05D5\u05E8 PDF \u05D0\u05D5 \u05EA\u05DE\u05D5\u05E0\u05D4 \u05EA\u05E7\u05D9\u05E0\u05D9\u05DD \u05D1\u05D2\u05D5\u05D3\u05DC \u05E2\u05D3 20MB." : "";
      $("#attach").disabled = !valid;
      if (!valid) selectedFile = null;
    }
    if (el.id === "doc-filter") {
      filter = el.value;
      render();
    }
    if (el.dataset.answer) {
      let v = el.value;
      if (el.dataset.multi) {
        const old = state.answers[el.dataset.answer] || [];
        if (el.dataset.multi === "employment") v = toggleEmployment(old, v, el.checked);
        else {
          const arr = Array.isArray(old) ? old : [];
          const exclusive = el.dataset.exclusive.split(",");
          v = el.checked ? exclusive.includes(v) ? [v] : [...arr.filter((x) => !exclusive.includes(x) && x !== v), v] : arr.filter((x) => x !== v);
        }
      }
      setAnswer(el.dataset.answer, v);
      persist();
      if (el.tagName === "SELECT" || el.dataset.multi) render();
    }
    if (el.dataset.task) {
      const t = state.tasks.find((t2) => t2.id === el.dataset.task);
      t.status = el.value;
      event("\u05E2\u05D5\u05D3\u05DB\u05E0\u05D4 \u05D4\u05E4\u05E2\u05D5\u05DC\u05D4: " + t.title);
      render();
    }
    if (el.id === "decision") {
      state.decision = el.value;
      event("\u05E2\u05D5\u05D3\u05DB\u05E0\u05D4 \u05D4\u05D7\u05DC\u05D8\u05EA \u05D4\u05DE\u05E9\u05E4\u05D7\u05D4");
      toast("\u05D4\u05D4\u05D7\u05DC\u05D8\u05D4 \u05E0\u05E9\u05DE\u05E8\u05D4 \u05D1\u05D4\u05D3\u05DE\u05D9\u05D4");
    }
    if (el.id === "contact-channel") {
      state.contact = el.value;
      persist();
      toast("\u05D4\u05E2\u05D3\u05E4\u05EA \u05D4\u05E7\u05E9\u05E8 \u05E0\u05E9\u05DE\u05E8\u05D4");
    }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "help-form") {
      state.help.unshift({ text: (helpContext ? helpContext + " \u2014 " : "") + e.target.elements.message.value, time: (/* @__PURE__ */ new Date()).toLocaleString("he-IL") });
      state.helpDraft = "";
      event("\u05E0\u05E8\u05E9\u05DE\u05D4 \u05D1\u05E7\u05E9\u05EA \u05E2\u05D6\u05E8\u05D4 \u05DC\u05D9\u05E9\u05E8\u05D0\u05DC");
      render();
      toast("\u05D4\u05D1\u05E7\u05E9\u05D4 \u05E0\u05E8\u05E9\u05DE\u05D4 \u05D1\u05DE\u05E2\u05E7\u05D1 \u05D4\u05DE\u05E7\u05D5\u05DE\u05D9. \u05DC\u05D0 \u05E0\u05E9\u05DC\u05D7\u05D4 \u05D4\u05D5\u05D3\u05E2\u05D4.");
    }
    if (e.target.id === "consent-form") {
      const d = state.docs.find((d2) => d2.signature);
      d.status = "signed";
      d.signer = e.target.elements.signer.value;
      d.signedAt = (/* @__PURE__ */ new Date()).toLocaleDateString("he-IL");
      event("\u05EA\u05D5\u05E2\u05D3\u05D4 \u05D4\u05E1\u05DB\u05DE\u05D4 \u05DC\u05D3\u05D5\u05D2\u05DE\u05D4");
      render();
      toast("\u05D4\u05D4\u05E1\u05DB\u05DE\u05D4 \u05EA\u05D5\u05E2\u05D3\u05D4 \u05D1\u05D4\u05D3\u05DE\u05D9\u05D4");
    }
  });
  render();
  $("#nav-home").insertAdjacentHTML("afterbegin", icon("services"));
  $("#nav-case").insertAdjacentHTML("afterbegin", icon("account"));
  $("#nav-help").insertAdjacentHTML("afterbegin", icon("help"));
  $(".account-circle").innerHTML = icon("profile");
  $(".simulation-nav").insertAdjacentHTML("afterbegin", icon("report"));
  $(".demo").innerHTML = `<span>${scenario ? "\u05EA\u05E8\u05D7\u05D9\u05E9: " + STAGES.find((s) => s.id === scenario).hint : "\u05EA\u05E6\u05D5\u05D2\u05EA \u05D4\u05D3\u05D2\u05DE\u05D4"}</span><div>${go("scenarios", "\u05DE\u05E1\u05DB\u05D9 \u05D4\u05EA\u05D4\u05DC\u05D9\u05DA", "demo-scenes")}${scenario ? B("\u05D7\u05D6\u05E8\u05D4 \u05DC\u05EA\u05D9\u05E7 \u05E9\u05DC\u05D9", 'data-act="leave-scenario"', "demo-scenes") : ""}</div>`;
  if (scenario) $("#nav-home").dataset.route = "stage/" + scenario;
})();
</script></body></html>
